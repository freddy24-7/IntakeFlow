<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IntakeFlow{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx-2.0.4.min.js" defer></script>
</head>
<body>
<header>
  <strong>IntakeFlow</strong>
  <nav>
    {% if role == "finance_clerk" %}
      <a href="/queue">Beoordelen</a>
      <a href="/upload">Uploaden</a>
    {% elif role == "team_lead" %}
      <a href="/dashboard">Dashboard</a>
    {% elif role == "contract_manager" %}
      <a href="/contracts">Contracten</a>
    {% endif %}
  </nav>
  <div class="header-links">
    <a href="/how-to-use">How to use</a>
    <a href="/tech-stack">Tech Stack</a>
  </div>
  {% if role %}
    <span class="muted">{{ roles[role] }} (demo)</span>
    <a href="/logout">Andere rol</a>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
