<table class="upload-result">
  {% for result in results %}
  <tr>
    <td>{{ result.filename }}</td>
    <td>
      {% if result.accepted %}
        <span class="badge">Ontvangen</span> Het document wordt verwerkt.
      {% else %}
        <span class="badge warn">Geweigerd</span> {{ result.message }}
      {% endif %}
    </td>
  </tr>
  {% endfor %}
</table>
