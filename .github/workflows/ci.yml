name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: intakeflow
          # Throwaway password for a database that lives only for this job.
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: intakeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intakeflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://intakeflow:ci-only@localhost:5432/intakeflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # No Azure here: models, Document Intelligence and Search are fakes.
      - run: uv run pytest tests/unit tests/integration --cov --cov-fail-under=70
      # A few browser tests of the main path, also with fakes.
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/e2e
