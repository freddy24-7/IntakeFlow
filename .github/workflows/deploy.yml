name: Deploy

# Started by hand only, so a push can never create cost by accident.
# Updates the image of an application that deploy/up-app.sh created.
on:
  workflow_dispatch:

permissions:
  id-token: write  # sign in to Azure with OpenID Connect, no stored secret
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04  # pinned: a new runner image should be a deliberate change
    env:
      GROUP: rg-intakeflow-dev
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build the image in the registry
        run: |
          REGISTRY=$(az acr list -g "$GROUP" --query "[0].name" -o tsv)
          TAG=$(git rev-parse --short HEAD)
          az acr build --registry "$REGISTRY" --image "intakeflow:$TAG" . --output none
          echo "IMAGE=$(az acr show -n "$REGISTRY" --query loginServer -o tsv)/intakeflow:$TAG" >> "$GITHUB_ENV"
      - name: Update the web application and the worker
        run: |
          az containerapp update -g "$GROUP" -n ca-intakeflow-web --image "$IMAGE" --output none
          az containerapp update -g "$GROUP" -n ca-intakeflow-worker --image "$IMAGE" --output none
      - name: Check the health endpoint
        run: |
          URL=$(az containerapp show -g "$GROUP" -n ca-intakeflow-web --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://$URL/health"
